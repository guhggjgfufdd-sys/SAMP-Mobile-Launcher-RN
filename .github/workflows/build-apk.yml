- name: Debug react-native config
        run: |
          echo "== check for react-native.config.js files =="
          find . -maxdepth 2 -name "react-native.config.js" -o -name ".react-native.config.js" | grep -v node_modules

          echo "== node & npm versions =="
          node -v
          npm -v

          echo "== verify package.json dependencies readable =="
          node -e "console.log(JSON.stringify(require('./package.json').dependencies, null, 2))"

          echo "== check for nested react-native installs =="
          find node_modules -maxdepth 3 -path "*/node_modules/react-native" -not -path "node_modules/react-native"

          echo "== check @react-native-community/cli-config resolution =="
          node -e "
            try {
              const config = require('@react-native-community/cli-config');
              console.log('cli-config module loaded OK');
            } catch (e) {
              console.log('ERROR loading cli-config:', e.message);
            }
          "

          echo "== run CLI config WITHOUT redirect to see stderr separately =="
          node node_modules/react-native/cli.js config --verbose
