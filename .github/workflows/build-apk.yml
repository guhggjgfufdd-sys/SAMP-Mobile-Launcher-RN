name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone original working repo
        run: |
          git clone --depth 1 https://github.com/penteleichuk/SAMP-Mobile-Launcher-RN.git

      - name: Checkout YOUR custom files
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Merge your custom files
        run: |
          cp -r fork/src/* SAMP-Mobile-Launcher-RN/src/ 2>/dev/null || true
          cp -r fork/assets/* SAMP-Mobile-Launcher-RN/assets/ 2>/dev/null || true
          cp -r fork/distribution/* SAMP-Mobile-Launcher-RN/distribution/ 2>/dev/null || true
          cp fork/.env SAMP-Mobile-Launcher-RN/.env 2>/dev/null || true

      - name: Setup Node.js 16 (compatible with RN 0.70)
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
          cd SAMP-Mobile-Launcher-RN
          npm install -g yarn
          yarn install

      - name: Make gradlew executable
        run: chmod +x SAMP-Mobile-Launcher-RN/android/gradlew

      - name: Build JS Bundle manually
        run: |
          cd SAMP-Mobile-Launcher-RN
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle

      - name: Build Release APK
        run: cd SAMP-Mobile-Launcher-RN/android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: SAMP-Mobile-Launcher-RN/android/app/build/outputs/apk/release/*.apk
