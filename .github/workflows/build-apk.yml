name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # 🟢 إجبار كافة عمليات جافا الفرعية (بما فيها Kotlin Workers) على استخدام 64MB للـ Stack
    env:
      JAVA_TOOL_OPTIONS: "-Xss64m -Xmx4096m"
      _JAVA_OPTIONS: "-Xss64m -Xmx4096m"
      GRADLE_OPTS: "-Xmx4096m -Xss64m -Dorg.gradle.jvmargs='-Xmx4096m -Xss64m' -Dkotlin.daemon.jvmargs='-Xmx2048m -Xss64m'"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Clean Gradle
        run: cd android && ./gradlew clean

      - name: Build Release APK
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
