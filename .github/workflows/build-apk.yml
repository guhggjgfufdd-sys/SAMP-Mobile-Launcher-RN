name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_OPTS: "-Xmx4096m"
      GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clean everything
        run: |
          rm -rf node_modules package-lock.json
          rm -f .babelrc
          npm cache clean --force

      - name: Install deps
        run: npm install

      - name: Verify install
        run: |
          echo "== package.json =="
          cat package.json
          echo "== node_modules count =="
          ls node_modules | wc -l
          echo "== react-native package =="
          cat node_modules/react-native/package.json | head -5 || echo "MISSING react-native folder!"
          echo "== react-native-fs package =="
          cat node_modules/react-native-fs/package.json | head -5 || echo "MISSING react-native-fs folder!"

      - name: Debug react-native config
        run: |
          node node_modules/react-native/cli.js config --verbose 2>&1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
