# Project-wide Gradle settings.

# Memory Configuration & Stack Size Fix (حل مشكلة الـ StackOverflow)
org.gradle.jvmargs=-Xmx4096m -Xss16m -XX:MaxMetaspaceSize=1024m
kotlin.daemon.jvmargs=-Xmx2048m -Xss16m
kotlin.compiler.execution.strategy=in-process

# AndroidX and Jetifier
android.useAndroidX=true
android.enableJetifier=true

# React Native & Flipper Properties
FLIPPER_VERSION=0.182.0

# Performance Options
org.gradle.parallel=true
org.gradle.caching=true
