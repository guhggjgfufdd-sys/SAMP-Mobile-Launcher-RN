name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone original working repo
        run: git clone --depth 1 https://github.com/penteleichuk/SAMP-Mobile-Launcher-RN.git

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd SAMP-Mobile-Launcher-RN
          npm install -g yarn
          yarn install

      - name: Make gradlew executable
        run: chmod +x SAMP-Mobile-Launcher-RN/android/gradlew

      - name: Build JS Bundle manually
        run: |
          cd SAMP-Mobile-Launcher-RN
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle

      - name: Build Release APK
        run: cd SAMP-Mobile-Launcher-RN/android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: SAMP-Mobile-Launcher-RN/android/app/build/outputs/apk/release/*.apk
