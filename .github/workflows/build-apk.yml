name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_OPTS: "-Xmx4096m"
      GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clean everything
        run: |
          rm -rf node_modules package-lock.json
          rm -f .babelrc
          npm cache clean --force

      - name: Install deps
        run: npm install

      - name: Debug react-native config
        run: |
          echo "--- Installed CLI packages ---"
          ls node_modules/@react-native-community/ || true
          echo "--- npm ls cli-platform-android ---"
          npm ls @react-native-community/cli-platform-android || true
          echo "--- verbose config ---"
          node node_modules/react-native/cli.js config --verbose || true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
