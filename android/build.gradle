buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.8.20"
        reactNativeVersion = "0.72.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

ext {
    buildToolsVersion = "34.0.0"
    minSdkVersion = 21
    compileSdkVersion = 34
    targetSdkVersion = 34
    ndkVersion = "25.1.8937393"
    kotlinVersion = "1.8.20"
    reactNativeVersion = "0.72.0"
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

subprojects { project ->
    def applyAndroidConfig = {
        if (project.hasProperty("android")) {
            project.android {
                buildFeatures {
                    buildConfig = true
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            if (project.android.namespace == null) {
                def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def manifestText = manifestFile.text
                    def matcher = manifestText =~ /package="([^"]+)"/
                    if (matcher.find()) {
                        project.android.namespace = matcher.group(1)
                    }
                }
            }
        }
    }

    project.pluginManager.withPlugin("com.android.library") { applyAndroidConfig() }
    project.pluginManager.withPlugin("com.android.application") { applyAndroidConfig() }

    project.afterEvaluate {
        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            if (project.android.namespace == null) {
                def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def manifestText = manifestFile.text
                    def matcher = manifestText =~ /package="([^"]+)"/
                    if (matcher.find()) {
                        project.android.namespace = matcher.group(1)
                    }
                }
            }
        }

        project.tasks.withType(JavaCompile).configureEach { task ->
            task.sourceCompatibility = JavaVersion.VERSION_17.toString()
            task.targetCompatibility = JavaVersion.VERSION_17.toString()

            if (task.options.hasProperty("release")) {
                task.options.release.set(null)
            }

            task.doFirst {
                task.sourceCompatibility = JavaVersion.VERSION_17.toString()
                task.targetCompatibility = JavaVersion.VERSION_17.toString()
                if (task.options.hasProperty("release")) {
                    task.options.release.set(null)
                }
                def cleanedArgs = []
                def skipNext = false
                for (def arg : task.options.compilerArgs) {
                    if (skipNext) {
                        skipNext = false
                        continue
                    }
                    if (arg == "--release" || arg == "-source" || arg == "-target") {
                        skipNext = true
                        continue
                    }
                    cleanedArgs.add(arg)
                }
                task.options.compilerArgs = cleanedArgs
            }
        }

        if (project.name.contains("react-native-reanimated")) {
            project.tasks.matching { it.name == "assertMinimalReactNativeVersionTask" }.configureEach {
                enabled = false
            }
        }
    }
}
