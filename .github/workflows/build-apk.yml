name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_OPTS: "-Xmx4096m"
      GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Clean everything
        run: rm -rf node_modules package-lock.json && rm -f .babelrc && npm cache clean --force
      - name: Install deps
        run: npm install
      - name: Verify install
        run: echo "== package.json ==" && cat package.json && echo "== node_modules count ==" && ls node_modules | wc -l
      - name: Debug react-native config deep
        run: |
          echo "check1: direct npx call bypassing react-native/cli.js"
          npx @react-native-community/cli config --verbose
          echo "check2: compare with react-native/cli.js wrapper"
          node node_modules/react-native/cli.js config --verbose
          echo "check3: inspect react-native cli.js file itself"
          cat node_modules/react-native/cli.js
          echo "check4: inspect react-native package.json platforms field"
          node -e "console.log(JSON.stringify(require('react-native/package.json').platforms || 'NO PLATFORMS FIELD', null, 2))"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
