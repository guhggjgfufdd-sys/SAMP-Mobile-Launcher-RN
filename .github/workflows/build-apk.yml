name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout YOUR fork
        uses: actions/checkout@v4

      - name: Fix broken files from original repo
        run: |
          git clone --depth 1 https://github.com/penteleichuk/SAMP-Mobile-Launcher-RN.git /tmp/original
          cp /tmp/original/package.json package.json
          cp /tmp/original/metro.config.js metro.config.js
          cp /tmp/original/babel.config.js babel.config.js
          cp /tmp/original/android/settings.gradle android/settings.gradle
          cp /tmp/original/android/build.gradle android/build.gradle
          cp /tmp/original/android/app/build.gradle android/app/build.gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install -g yarn
          rm -rf node_modules yarn.lock
          yarn install --ignore-engines

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Clean previous builds
        run: cd android && ./gradlew clean

      - name: Build JS Bundle manually
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk
