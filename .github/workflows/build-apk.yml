name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json yarn.lock
          yarn install --ignore-engines

      - name: Install all missing packages
        run: |
          yarn add react-native-svg-transformer --ignore-engines
          yarn add babel-plugin-transform-remove-console --ignore-engines
          yarn add react-native-dotenv --ignore-engines
          yarn add @gorhom/bottom-sheet --ignore-engines
          yarn add @react-native-async-storage/async-storage --ignore-engines
          yarn add @react-navigation/native @react-navigation/bottom-tabs --ignore-engines
          yarn add react-native-bootsplash --ignore-engines
          yarn add react-native-gesture-handler --ignore-engines
          yarn add react-native-safe-area-context --ignore-engines
          yarn add react-native-screens --ignore-engines
          yarn add react-native-reanimated --ignore-engines
          yarn add react-native-vector-icons --ignore-engines
          yarn add react-native-linear-gradient --ignore-engines
          yarn add react-native-fs --ignore-engines
          yarn add react-native-device-info --ignore-engines
          yarn add react-native-fast-image --ignore-engines
          yarn add react-native-progress --ignore-engines
          yarn add react-native-shadow-2 --ignore-engines
          yarn add react-native-size-matters --ignore-engines
          yarn add react-native-snowflakes --ignore-engines
          yarn add react-native-svg --ignore-engines
          yarn add react-native-svg-icon --ignore-engines
          yarn add react-native-switch --ignore-engines
          yarn add lottie-react-native --ignore-engines
          yarn add react-native-animated-nav-tab-bar --ignore-engines
          yarn add react-native-awesome-alerts --ignore-engines
          yarn add react-native-reanimated-carousel --ignore-engines
          yarn add react-native-quick-base64 --ignore-engines
          yarn add axios --ignore-engines
          yarn add ini --ignore-engines
          yarn add buffer --ignore-engines
          yarn add styled-components --ignore-engines
          yarn add react-redux redux redux-thunk --ignore-engines

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Clean previous builds
        run: cd android && ./gradlew clean

      - name: Build JS Bundle manually
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk
