name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone original working repo
        run: |
          git clone --depth 1 https://github.com/penteleichuk/SAMP-Mobile-Launcher-RN.git

      - name: Save original files
        run: |
          cp SAMP-Mobile-Launcher-RN/package.json /tmp/original-package.json
          cp SAMP-Mobile-Launcher-RN/android/settings.gradle /tmp/original-settings.gradle
          cp SAMP-Mobile-Launcher-RN/android/build.gradle /tmp/original-build.gradle
          cp SAMP-Mobile-Launcher-RN/android/app/build.gradle /tmp/original-app-build.gradle
          cp SAMP-Mobile-Launcher-RN/android/gradle.properties /tmp/original-gradle.properties

      - name: Checkout YOUR custom files
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Merge ALL your custom files
        run: |
          cp -r fork/src/* SAMP-Mobile-Launcher-RN/src/ 2>/dev/null || true
          cp -r fork/assets/* SAMP-Mobile-Launcher-RN/assets/ 2>/dev/null || true
          cp -r fork/android/app/src/main/res/* SAMP-Mobile-Launcher-RN/android/app/src/main/res/ 2>/dev/null || true
          cp fork/.env SAMP-Mobile-Launcher-RN/.env 2>/dev/null || true
          cp fork/app.json SAMP-Mobile-Launcher-RN/app.json 2>/dev/null || true
          # ننسخ AndroidManifest.xml لو موجود في فوركك
          cp fork/android/app/src/main/AndroidManifest.xml SAMP-Mobile-Launcher-RN/android/app/src/main/AndroidManifest.xml 2>/dev/null || true

      - name: Restore original Gradle files
        run: |
          cp /tmp/original-package.json SAMP-Mobile-Launcher-RN/package.json
          cp /tmp/original-settings.gradle SAMP-Mobile-Launcher-RN/android/settings.gradle
          cp /tmp/original-build.gradle SAMP-Mobile-Launcher-RN/android/build.gradle
          cp /tmp/original-app-build.gradle SAMP-Mobile-Launcher-RN/android/app/build.gradle
          cp /tmp/original-gradle.properties SAMP-Mobile-Launcher-RN/android/gradle.properties

      - name: Fix Android permissions for storage
        run: |
          cd SAMP-Mobile-Launcher-RN/android/app/src/main
          # نضيف MANAGE_EXTERNAL_STORAGE للصلاحيات
          sed -i 's|</manifest>|<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n</manifest>|' AndroidManifest.xml
          # نتأكد WRITE_EXTERNAL_STORAGE موجود
          if ! grep -q "WRITE_EXTERNAL_STORAGE" AndroidManifest.xml; then
            sed -i 's|</manifest>|<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n</manifest>|' AndroidManifest.xml
          fi

      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
          cd SAMP-Mobile-Launcher-RN
          npm install -g yarn
          yarn install

      - name: Install missing packages for your src
        run: |
          cd SAMP-Mobile-Launcher-RN
          npm install --legacy-peer-deps @react-navigation/bottom-tabs@^6 @gorhom/bottom-sheet@^4 @react-native-async-storage/async-storage@^1 react-native-zip-archive@5.0.3

      - name: Fix Android build memory
        run: |
          cd SAMP-Mobile-Launcher-RN
          sed -i 's/org.gradle.jvmargs=-Xmx2048m/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m/' android/gradle.properties || echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

      - name: Make gradlew executable
        run: chmod +x SAMP-Mobile-Launcher-RN/android/gradlew

      - name: Clean build
        run: cd SAMP-Mobile-Launcher-RN/android && ./gradlew clean

      - name: Build JS Bundle manually
        run: |
          cd SAMP-Mobile-Launcher-RN
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle

      - name: Build Release APK
        run: cd SAMP-Mobile-Launcher-RN/android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: SAMP-Mobile-Launcher-RN/android/app/build/outputs/apk/release/*.apk
