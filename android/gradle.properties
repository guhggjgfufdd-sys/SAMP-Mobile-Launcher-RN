# Project-wide Gradle settings.

# Memory & Stack Size Configuration (رفع حجم الـ Stack إلى 32M لمنع StackOverflowError)
org.gradle.jvmargs=-Xmx4096m -Xss32m -XX:MaxMetaspaceSize=1024m
kotlin.daemon.jvmargs=-Xmx2048m -Xss32m

# AndroidX and Jetifier
android.useAndroidX=true
android.enableJetifier=true

# React Native & Flipper Properties
FLIPPER_VERSION=0.182.0

# Performance Options
org.gradle.parallel=true
org.gradle.caching=true
