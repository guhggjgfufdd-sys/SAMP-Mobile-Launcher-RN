name: Build SAMP Mobile APK

on:
  push:
    branches:
      - replit/samp-launcher-armv7-20261029

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Install dependencies
        run: yarn install --no-lockfile

      - name: Patch Reanimated for Android build
        run: |
          rm -rf node_modules/react-native-reanimated/android/src/reactNativeVersionPatch/73
          rm -rf node_modules/react-native-reanimated/android/src/reactNativeVersionPatch/74
          rm -rf node_modules/react-native-reanimated/android/src/reactNativeVersionPatch/75
          rm -rf node_modules/react-native-reanimated/android/src/reactNativeVersionPatch/76
          sed -i 's/com.swmansion.reanimated.R.id.action_bar_root/android.R.id.content/g' node_modules/react-native-reanimated/android/src/main/java/com/swmansion/reanimated/keyboardObserver/ReanimatedKeyboardEventListener.java

      - name: Patch legacy Android library namespaces for AGP 8
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          patched = 0
          for manifest in Path('node_modules').glob('**/android/src/main/AndroidManifest.xml'):
              xml = manifest.read_text(encoding='utf-8')
              match = re.search(r'package="([^"]+)"', xml)
              if not match:
                  continue
              namespace = match.group(1)
              android_dir = manifest.parents[2]
              build_file = android_dir / 'build.gradle'
              kotlin_file = android_dir / 'build.gradle.kts'
              gradle = build_file if build_file.exists() else kotlin_file
              if not gradle.exists():
                  continue
              source = gradle.read_text(encoding='utf-8')
              if not re.search(r'^\s*namespace\s*[=]?\s*["\']', source, re.M):
                  block = re.search(r'^\s*android\s*\{', source, re.M)
                  if not block:
                      continue
                  declaration = '    namespace = "' + namespace + '"' if gradle.suffix == '.kts' else '    namespace "' + namespace + '"'
                  source = source[:block.end()] + '\n' + declaration + source[block.end():]
                  gradle.write_text(source, encoding='utf-8')
              xml = xml.replace(match.group(0), '', 1)
              manifest.write_text(xml, encoding='utf-8')
              patched += 1
          print('Patched legacy Android manifests:', patched)
          PY

      - name: Fix old react-native-screens AppCompat attribute
        run: sed -i 's/R\.attr\.colorPrimary/androidx.appcompat.R.attr.colorPrimary/g' node_modules/react-native-screens/android/src/main/java/com/swmansion/rnscreens/ScreenStackHeaderConfig.kt

      - name: Bundle JavaScript assets
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/ --reset-cache

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..
          test -s android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk samp-mobile-launcher-armv7.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: samp-mobile-launcher-armv7
          path: samp-mobile-launcher-armv7.apk
          retention-days: 14

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v1.0.1
          name: SAMP Mobile Launcher 1.0.1 - ARMv7
          target_commitish: ${{ github.sha }}
          body: |
            Android APK configured for SA-MP server 142.132.203.47:21299 with the 2.11 cache download flow.

            ABI: armeabi-v7a (32-bit). ARM64 phones that still support 32-bit apps are compatible; 64-bit-only devices are not supported by the available game libraries.
          files: samp-mobile-launcher-armv7.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
