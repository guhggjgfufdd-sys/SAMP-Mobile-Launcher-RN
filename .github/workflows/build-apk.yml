name: Build Android APK

on:
  workflow_dispatch:
    push:
      branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Clean Reanimated Incompatible Patches
        run: |
          rm -rf node_modules/react-native-reanimated/android/src/reactNativeVersionPatch/73
          rm -rf node_modules/react-native-reanimated/android/src/reactNativeVersionPatch/74
          rm -rf node_modules/react-native-reanimated/android/src/reactNativeVersionPatch/75
          rm -rf node_modules/react-native-reanimated/android/src/reactNativeVersionPatch/76

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
