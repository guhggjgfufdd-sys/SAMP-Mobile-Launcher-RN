# Project-wide Gradle settings.

# Memory & Stack Size Configuration
org.gradle.jvmargs=-Xmx4096m -Xss32m -XX:MaxMetaspaceSize=1024m
kotlin.daemon.jvmargs=-Xmx2048m -Xss32m

# Force Kotlin compiler to run in-process (حل مشكلة Gradle Workers)
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# AndroidX and Jetifier
android.useAndroidX=true
android.enableJetifier=true

# React Native & Flipper Properties
FLIPPER_VERSION=0.182.0

# Performance Options
org.gradle.parallel=true
org.gradle.caching=true
