name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout YOUR fork
        uses: actions/checkout@v4

      - name: Fix broken files from original repo
        run: |
          curl -o package.json https://raw.githubusercontent.com/penteleichuk/SAMP-Mobile-Launcher-RN/main/package.json
          curl -o metro.config.js https://raw.githubusercontent.com/penteleichuk/SAMP-Mobile-Launcher-RN/main/metro.config.js
          curl -o babel.config.js https://raw.githubusercontent.com/penteleichuk/SAMP-Mobile-Launcher-RN/main/babel.config.js
          curl -o android/settings.gradle https://raw.githubusercontent.com/penteleichuk/SAMP-Mobile-Launcher-RN/main/android/settings.gradle
          curl -o android/build.gradle https://raw.githubusercontent.com/penteleichuk/SAMP-Mobile-Launcher-RN/main/android/build.gradle
          curl -o android/app/build.gradle https://raw.githubusercontent.com/penteleichuk/SAMP-Mobile-Launcher-RN/main/android/app/build.gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install -g yarn
          rm -rf node_modules yarn.lock
          yarn install --ignore-engines

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Clean previous builds
        run: cd android && ./gradlew clean

      - name: Build JS Bundle manually
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk
