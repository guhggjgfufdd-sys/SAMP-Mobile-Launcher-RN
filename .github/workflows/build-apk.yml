name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone original working repo
        run: |
          git clone --depth 1 https://github.com/penteleichuk/SAMP-Mobile-Launcher-RN.git

      - name: Checkout YOUR custom files
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Merge ONLY safe custom files
        run: |
          # ننسخ كود React Native (JS)
          cp -r fork/src/* SAMP-Mobile-Launcher-RN/src/ 2>/dev/null || true
          
          # ننسخ الصور والموارد
          cp -r fork/assets/* SAMP-Mobile-Launcher-RN/assets/ 2>/dev/null || true
          
          # ننسخ ملفات الأندرويد (icon, name, colors) - بس الـ res مو الـ java
          cp -r fork/android/app/src/main/res/* SAMP-Mobile-Launcher-RN/android/app/src/main/res/ 2>/dev/null || true
          
          # ننسخ الإعدادات
          cp fork/.env SAMP-Mobile-Launcher-RN/.env 2>/dev/null || true
          cp fork/app.json SAMP-Mobile-Launcher-RN/app.json 2>/dev/null || true

      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
          cd SAMP-Mobile-Launcher-RN
          npm install -g yarn
          yarn install

      - name: Install missing packages for your src
        run: |
          cd SAMP-Mobile-Launcher-RN
          npm install --legacy-peer-deps @react-navigation/bottom-tabs@^6 @gorhom/bottom-sheet@^4 @react-native-async-storage/async-storage@^1 react-native-zip-archive@5.0.3

      - name: Fix Android build memory
        run: |
          cd SAMP-Mobile-Launcher-RN
          sed -i 's/org.gradle.jvmargs=-Xmx2048m/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m/' android/gradle.properties || echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

      - name: Make gradlew executable
        run: chmod +x SAMP-Mobile-Launcher-RN/android/gradlew

      - name: Clean build
        run: cd SAMP-Mobile-Launcher-RN/android && ./gradlew clean

      - name: Build JS Bundle manually
        run: |
          cd SAMP-Mobile-Launcher-RN
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle

      - name: Build Release APK
        run: cd SAMP-Mobile-Launcher-RN/android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: SAMP-Mobile-Launcher-RN/android/app/build/outputs/apk/release/*.apk
