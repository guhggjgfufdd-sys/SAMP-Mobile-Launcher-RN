name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_OPTS: "-Xmx4096m"
      GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

       - name: Install deps
        run: yarn install

      - name: Verify install
        run: |
          echo "== package.json =="
          cat package.json
          echo "== node_modules count =="
          ls node_modules | wc -l

      - name: Debug react-native config deep
        run: |
          echo "check1: actual resolved cli-config version"
          yarn list @react-native-community/cli-config --depth=0
          echo "check2: actual resolved cli-platform-android version"
          yarn list @react-native-community/cli-platform-android --depth=0
          echo "check3: what react-native config ACTUALLY returns (this is what Gradle calls)"
          npx react-native config

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
