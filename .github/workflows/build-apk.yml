name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json yarn.lock
          yarn install --ignore-engines

      - name: Install ALL missing packages
        run: |
          yarn add react-native-svg-transformer@^1.0.0 --ignore-engines
          yarn add babel-plugin-transform-remove-console@^6.9.4 --ignore-engines
          yarn add react-native-dotenv@^3.4.11 --ignore-engines
          yarn add @gorhom/bottom-sheet@^4 --ignore-engines
          yarn add @react-native-async-storage/async-storage@^1.17.10 --ignore-engines
          yarn add @react-navigation/native@^6.0.13 @react-navigation/bottom-tabs@^6.4.0 @react-navigation/native-stack@^6.9.1 --ignore-engines
          yarn add react-native-bootsplash@^4.3.2 --ignore-engines
          yarn add react-native-gesture-handler@^2.8.0 --ignore-engines
          yarn add react-native-safe-area-context@^4.4.1 --ignore-engines
          yarn add react-native-screens@^3.18.2 --ignore-engines
          yarn add react-native-reanimated@^2.12.0 --ignore-engines
          yarn add react-native-vector-icons@^9.2.0 --ignore-engines
          yarn add react-native-linear-gradient@^2.6.2 --ignore-engines
          yarn add react-native-fs@^2.20.0 --ignore-engines
          yarn add react-native-device-info@^10.3.0 --ignore-engines
          yarn add react-native-fast-image@^8.6.3 --ignore-engines
          yarn add react-native-progress@^5.0.0 --ignore-engines
          yarn add react-native-shadow-2@^7.0.6 --ignore-engines
          yarn add react-native-size-matters@^0.4.0 --ignore-engines
          yarn add react-native-snowflakes@^1.0.3 --ignore-engines
          yarn add react-native-svg@^13.4.0 --ignore-engines
          yarn add react-native-svg-icon@^0.10.0 --ignore-engines
          yarn add react-native-switch@^1.5.1 --ignore-engines
          yarn add lottie-react-native@^5.1.4 --ignore-engines
          yarn add react-native-animated-nav-tab-bar@^3.1.8 --ignore-engines
          yarn add react-native-awesome-alerts@^2.0.0 --ignore-engines
          yarn add react-native-reanimated-carousel@^3.1.5 --ignore-engines
          yarn add react-native-quick-base64@^2.0.5 --ignore-engines
          yarn add react-native-zip-archive@^6.0.0 --ignore-engines
          yarn add axios@^1.6.7 --ignore-engines
          yarn add ini@^4.1.1 --ignore-engines
          yarn add buffer@^6.0.3 --ignore-engines
          yarn add styled-components@^5.3.6 --ignore-engines
          yarn add react-redux@^8.0.4 redux@^4.2.0 redux-thunk@^2.4.1 --ignore-engines
          yarn add @notifee/react-native@^7.0.0 --ignore-engines
          yarn add @react-native-community/blur@^4.3.0 --ignore-engines
          yarn add @react-native-community/masked-view@^0.1.11 --ignore-engines
          yarn add @react-native-firebase/app@15.7.0 @react-native-firebase/crashlytics@15.7.0 @react-native-firebase/messaging@15.7.0 --ignore-engines
          yarn add @sayem314/react-native-keep-awake@^1.1.0 --ignore-engines
          yarn add @sharcoux/slider@^6.0.3 --ignore-engines
          yarn add @dominicvonk/react-native-apk-installer@^2.2.2 --ignore-engines

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Clean previous builds
        run: cd android && ./gradlew clean

      - name: Build JS Bundle manually
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk
