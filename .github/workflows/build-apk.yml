name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json yarn.lock
          yarn install

      - name: Install all missing packages
        run: |
          yarn add react-native-svg-transformer
          yarn add babel-plugin-transform-remove-console
          yarn add react-native-dotenv
          yarn add @gorhom/bottom-sheet
          yarn add @react-native-async-storage/async-storage
          yarn add @react-navigation/native @react-navigation/bottom-tabs
          yarn add react-native-bootsplash
          yarn add react-native-gesture-handler
          yarn add react-native-safe-area-context
          yarn add react-native-screens
          yarn add react-native-reanimated
          yarn add react-native-vector-icons
          yarn add react-native-linear-gradient
          yarn add react-native-fs
          yarn add react-native-device-info
          yarn add react-native-fast-image
          yarn add react-native-progress
          yarn add react-native-shadow-2
          yarn add react-native-size-matters
          yarn add react-native-snowflakes
          yarn add react-native-svg
          yarn add react-native-svg-icon
          yarn add react-native-switch
          yarn add lottie-react-native
          yarn add react-native-animated-nav-tab-bar
          yarn add react-native-awesome-alerts
          yarn add react-native-reanimated-carousel
          yarn add react-native-quick-base64
          yarn add axios
          yarn add ini
          yarn add buffer
          yarn add styled-components
          yarn add react-redux redux redux-thunk

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Clean previous builds
        run: cd android && ./gradlew clean

      - name: Build JS Bundle manually
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk
