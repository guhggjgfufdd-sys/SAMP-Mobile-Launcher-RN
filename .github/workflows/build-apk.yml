name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone original working repo
        run: |
          git clone --depth 1 https://github.com/penteleichuk/SAMP-Mobile-Launcher-RN.git original

      - name: Checkout YOUR custom files
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Merge your custom files into original
        run: |
          cp -r fork/src/* original/src/ 2>/dev/null || true
          cp -r fork/assets/* original/assets/ 2>/dev/null || true
          cp -r fork/distribution/* original/distribution/ 2>/dev/null || true
          cp fork/.env original/.env 2>/dev/null || true

      - name: Fix package.json for production build
        run: |
          cd original
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies = pkg.dependencies || {};
            pkg.devDependencies = pkg.devDependencies || {};
            
            // Move packages from devDependencies to dependencies
            const moveToDeps = [
              '@gorhom/bottom-sheet', '@react-native-async-storage/async-storage',
              '@react-navigation/native', '@react-navigation/native-stack',
              '@notifee/react-native', '@react-native-community/blur',
              '@react-native-community/masked-view', '@react-native-firebase/app',
              '@react-native-firebase/crashlytics', '@react-native-firebase/messaging',
              '@sayem314/react-native-keep-awake', '@sharcoux/slider',
              '@dominicvonk/react-native-apk-installer'
            ];
            
            for (const name of moveToDeps) {
              if (pkg.devDependencies[name]) {
                pkg.dependencies[name] = pkg.devDependencies[name];
                delete pkg.devDependencies[name];
              }
            }
            
            // Add missing packages that user's src needs
            const addMissing = {
              '@react-navigation/bottom-tabs': '^6.4.0',
              'react-native-zip-archive': '^6.0.0'
            };
            
            for (const [name, version] of Object.entries(addMissing)) {
              if (!pkg.dependencies[name]) pkg.dependencies[name] = version;
            }
            
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd original
          npm install -g yarn
          rm -rf node_modules yarn.lock
          yarn install --ignore-engines

      - name: Make gradlew executable
        run: chmod +x original/android/gradlew

      - name: Build JS Bundle manually
        run: |
          cd original
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle

      - name: Build Release APK
        run: cd original/android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: original/android/app/build/outputs/apk/release/*.apk
